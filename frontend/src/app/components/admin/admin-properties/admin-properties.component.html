<div class="page-container">
    <div class="header">
        <h1>Properties Management</h1>
        <a routerLink="/admin/properties/add" class="btn-primary">
            <i class="fas fa-plus"></i> Add Property
        </a>
    </div>

    <!-- Filters -->
    <div class="filters">
        <div class="filter-tabs">
            <button [class.active]="filter === 'All'" (click)="setFilter('All')">All</button>
            <button [class.active]="filter === 'Active'" (click)="setFilter('Active')">Active</button>
            <button [class.active]="filter === 'Sold'" (click)="setFilter('Sold')">Sold</button>
            <button [class.active]="filter === 'Rented'" (click)="setFilter('Rented')">Rented</button>
            <button [class.active]="filter === 'Hidden'" (click)="setFilter('Hidden')">Hidden</button>
        </div>
    </div>

    <div *ngIf="loading" class="loading">Loading properties...</div>

    <div *ngIf="!loading && filteredProperties.length === 0" class="empty-state">
        <p>No properties found.</p>
    </div>

    <div class="listings-grid" *ngIf="!loading && filteredProperties.length > 0">
        <div class="listing-card" *ngFor="let prop of filteredProperties">
            <div class="img-wrapper">
                <img [src]="prop.imageUrl || 'assets/placeholder.jpg'" alt="Property" class="thumb">
                <span class="category-tag">{{ prop.type || 'Property' }}</span>
                <div class="owner-badge" *ngIf="prop.owner">
                    <i class="fas fa-user-tie"></i> {{ prop.owner.name }}
                </div>
            </div>

            <div class="details">
                <div *ngIf="editingId !== prop._id">
                    <h3>{{ prop.title }}</h3>
                    <p class="price">{{ prop.price | currency }}</p>
                </div>
                <div *ngIf="editingId === prop._id" class="edit-fields">
                    <input [(ngModel)]="prop.title" (change)="onFieldChange(prop._id, 'title', prop.title)"
                        class="edit-input" placeholder="Title">
                    <input type="number" [(ngModel)]="prop.price"
                        (change)="onFieldChange(prop._id, 'price', prop.price)" class="edit-input"
                        placeholder="Price">
                </div>

                <p class="loc">
                    <i class="fas fa-map-marker-alt"></i> {{ prop.location }}
                </p>

                <div class="meta">
                    <span class="badge" [class.sold]="prop.status === 'Sold' || prop.status === 'Rented'"
                        [class.active]="prop.status === 'Active'" [class.hidden]="prop.status === 'Hidden'">
                        {{ prop.status }}
                    </span>
                    <span class="date">{{ prop.createdAt | date:'mediumDate' }}</span>
                </div>
            </div>

            <!-- Admin Actions -->
            <div class="actions">
                <a [routerLink]="['/properties', prop._id]" class="btn-sm btn-view">View</a>
                <a [routerLink]="['/admin/properties/edit', prop._id]" class="btn-sm btn-full-edit">Full Edit</a>

                <button (click)="toggleEdit(prop._id)" class="btn-sm btn-edit" [class.active-edit]="editingId === prop._id">
                    {{ editingId === prop._id ? 'Done' : 'Edit' }}
                </button>

                <button *ngIf="prop.status === 'Active'" (click)="updateStatus(prop._id, 'Sold')"
                    class="btn-sm btn-sold">Sold</button>

                <button *ngIf="prop.status === 'Active'" (click)="updateStatus(prop._id, 'Rented')"
                    class="btn-sm btn-rented">Rented</button>

                <button *ngIf="prop.status !== 'Hidden'" (click)="updateStatus(prop._id, 'Hidden')"
                    class="btn-sm btn-hide">Hide</button>

                <button *ngIf="prop.status === 'Hidden'" (click)="updateStatus(prop._id, 'Active')"
                    class="btn-sm btn-relit">Active</button>

                <button (click)="deleteProperty(prop._id)" class="btn-sm btn-delete">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
</div>
