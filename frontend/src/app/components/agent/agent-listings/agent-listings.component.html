<div class="page-container">
    <div class="header">
        <h1>My Listings</h1>
        <a routerLink="/agent/properties/add" class="btn-primary">
            <i class="fas fa-plus"></i> Add New Property
        </a>
    </div>

    <!-- Filters -->
    <div class="filters">
        <div class="filter-tabs">
            <button [class.active]="filter === 'All'" (click)="setFilter('All')">All</button>
            <button [class.active]="filter === 'Active'" (click)="setFilter('Active')">Active</button>
            <button [class.active]="filter === 'Sold'" (click)="setFilter('Sold')">Sold</button>
            <button [class.active]="filter === 'Rented'" (click)="setFilter('Rented')">Rented</button>
        </div>
    </div>

    <div *ngIf="loading" class="loading">Loading listings...</div>

    <div *ngIf="!loading && filteredListings.length === 0" class="empty-state">
        <p>No properties found.</p>
        <a routerLink="/agent/properties/add" class="btn-primary"
            style="margin-top: 1rem; display: inline-block;">Create One Now</a>
    </div>

    <div class="listings-grid" *ngIf="!loading && filteredListings.length > 0">
        <div class="listing-card" *ngFor="let property of filteredListings">
            <div class="img-wrapper">
                <img [src]="property.imageUrl || 'assets/placeholder.jpg'" alt="Property" class="thumb">
                <span class="category-tag">{{ property.type || 'Property' }}</span>
            </div>

            <div class="details">
                <div *ngIf="editingId !== property._id">
                    <h3>{{ property.title }}</h3>
                    <p class="price">{{ property.price | currency }}</p>
                </div>
                <div *ngIf="editingId === property._id" class="edit-fields">
                    <input [(ngModel)]="property.title" (change)="onFieldChange(property._id, 'title', property.title)"
                        class="edit-input" placeholder="Title">
                    <input type="number" [(ngModel)]="property.price"
                        (change)="onFieldChange(property._id, 'price', property.price)" class="edit-input"
                        placeholder="Price">
                </div>

                <p class="loc">
                    <i class="fas fa-map-marker-alt"></i> {{ property.location }}
                </p>

                <div class="meta">
                    <span class="badge" [class.sold]="property.status === 'Sold' || property.status === 'Rented'"
                        [class.active]="property.status === 'Active'">
                        {{ property.status }}
                    </span>
                    <span class="date">{{ property.createdAt | date:'mediumDate' }}</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <a [routerLink]="['/properties', property._id]" class="btn-sm btn-view">View</a>
                <a [routerLink]="['/agent/properties/edit', property._id]" class="btn-sm btn-full-edit">Full Edit</a>

                <button (click)="toggleEdit(property._id)" class="btn-sm btn-edit" [class.active-edit]="editingId === property._id">
                    {{ editingId === property._id ? 'Done' : 'Edit' }}
                </button>

                <button *ngIf="property.status === 'Active'" (click)="updateStatus(property._id, 'Sold')"
                    class="btn-sm btn-sold">Sold</button>
                <button *ngIf="property.status === 'Active'" (click)="updateStatus(property._id, 'Rented')"
                    class="btn-sm btn-rented">Rented</button>
                <button *ngIf="property.status !== 'Active'" (click)="updateStatus(property._id, 'Active')"
                    class="btn-sm btn-relit">Re-List</button>

                <button (click)="deleteProperty(property._id)" class="btn-sm btn-delete">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
</div>
