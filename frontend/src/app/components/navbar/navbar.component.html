<nav class="navbar">
    <div class="container navbar-content">
        <a routerLink="/" class="logo">EstatePro</a>
        <ul class="nav-links">
            <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
            <li><a routerLink="/properties" routerLinkActive="active">Properties</a></li>
            <li><a routerLink="/plans" routerLinkActive="active">Plans</a></li>
            <li><a routerLink="/about" routerLinkActive="active">About</a></li>
            <li *ngIf="!isAgent()"><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
            <li *ngIf="isAgent()"><a routerLink="/contact" routerLinkActive="active">Contact Support</a></li>
        </ul>

        <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle Dark Mode">
            <i class="fas" [class.fa-sun]="isDarkMode" [class.fa-moon]="!isDarkMode"></i>
        </button>

        <div class="auth-links">
            <ng-container *ngIf="!authService.currentUserStr(); else loggedIn">
                <a routerLink="/login" class="btn btn-outline small">Sign In</a>
                <a routerLink="/register" class="btn btn-primary small">Sign Up</a>
            </ng-container>
            <ng-template #loggedIn>
                <div class="user-menu">
                    <span class="welcome">Hi, {{ authService.currentUserStr().name }}</span>



                    <a *ngIf="authService.getUserRole() === 'admin'" routerLink="/admin/dashboard"
                        class="dashboard-link">Admin Panel</a>
                    <a *ngIf="authService.getUserRole() === 'agent'" routerLink="/agent/dashboard"
                        class="dashboard-link">Agent Dashboard</a>
                    <a *ngIf="authService.getUserRole() === 'user'" routerLink="/user/dashboard"
                        class="dashboard-link">User Dashboard</a>

                    <button (click)="authService.logout()" class="btn btn-outline small">Logout</button>
                </div>
            </ng-template>
        </div>
    </div>
</nav>
