<div class="auth-container">
    <div class="auth-card card">
        <h2>Welcome Back</h2>
        <p>Sign in to continue to EstatePro</p>

        <div class="alert error" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="login()">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="john@example.com"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" [(ngModel)]="password" name="password" class="form-control"
                    placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary full-width">Sign In</button>
        </form>

        <div class="test-credentials">
            <small>Click to use Demo Credentials:</small>
            <div class="chips">
                <span (click)="fillCreds('admin@example.com', 'admin123')" class="chip admin">Admin</span>
                <span (click)="fillCreds('agent@example.com', 'agent123')" class="chip agent">Agent</span>
                <span (click)="fillCreds('user@example.com', 'user123')" class="chip user">User</span>
            </div>
        </div>

        <p class="auth-footer">
            Don't have an account? <a routerLink="/register">Sign up</a>
        </p>
    </div>
</div>
