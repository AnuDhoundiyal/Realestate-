<div class="auth-container">
    <div class="auth-card card">
        <h2>Create Account</h2>
        <p>Join EstatePro network today</p>

        <div class="alert error" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="register()">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" [(ngModel)]="name" name="name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="john@example.com"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" [(ngModel)]="password" name="password" class="form-control"
                    placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>I want to:</label>
                <select [(ngModel)]="role" name="role" class="form-control">
                    <option value="user">Buy or Rent Properties</option>
                    <option value="agent">List Properties (Agent)</option>
                </select>
                <small class="hint">Admins must be added manually.</small>
            </div>

            <div class="form-group">
                <label>Profile Image (Optional)</label>
                <input type="file" (change)="onFileSelected($event)" accept="image/*">
            </div>

            <button type="submit" [disabled]="!name || !email || !password"
                class="btn btn-primary full-width">Register</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a routerLink="/login">Sign in</a>
        </p>
    </div>
</div>
